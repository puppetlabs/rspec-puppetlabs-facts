name: "ci"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    strategy:
      fail-fast: false
      matrix:
        ruby_version: ["3.2", "4.0"]
        include:
          - puppet_gem_version: "~> 8.0"
            ruby_version: "3.2"
          - puppet_gem_version: "~> 9.0"
            ruby_version: "4.0"
    name: "spec (ruby ${{ matrix.ruby_version }})"
    uses: "puppetlabs/cat-github-actions/.github/workflows/gem_ci.yml@main"
    secrets: inherit
    with:
      rake_task: 'spec check_leftovers'
      ruby_version: ${{ matrix.ruby_version }}
      puppet_gem_version: ${{ matrix.puppet_gem_version }}
