---
file_name: CHANGELOG.md
excluded_labels:
  - maintenance
  - dependencies
  - skip-changelog
  - github_actions
sections:
  changed:
    - backwards-incompatible
  added:
    - feature
    - enhancement
  fixed:
    - bug
    - bugfix
    - documentation
skip_entries_without_label: false
show_unreleased: true
check_for_updates: false
